<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Details</h1>
        <a href="index.html" class="back-link">← Back to Marketplace</a>
    </header>

    <main>
        <div class="product-detail">
            <div class="product-image">
                <img src="https://via.placeholder.com/400x300" alt="Phone">
            </div>

            <div class="product-info">
                <h2>Phone</h2>
                <p class="description">This is a good phone with excellent features and performance.</p>
                <p class="price">TSH 50,000</p>

                <div class="seller-contact">
                    <h3>Seller Contact</h3>
                    <div class="contact-info">
                        <p><strong>Email:</strong> <a href="mailto:seller@gmail.com">seller@gmail.com</a></p>
                        <p><strong>Phone:</strong> <a href="tel:+255123456789">+255 123 456 789</a></p>
                    </div>
                </div>

                <button class="contact-btn" onclick="contactSeller()">Contact Seller</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
